name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: test -z "$(gofmt -l .)"
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: '! go list -deps ./cmd/ctxgate | grep -q modelcontextprotocol/go-sdk'
